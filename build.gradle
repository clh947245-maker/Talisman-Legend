plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '6.0.36'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Keep the wrapper lightweight; switch to ALL if you want Gradle sources/docs locally.
    distributionType = Wrapper.DistributionType.BIN
}

def requiredProperty = { String name -> providers.gradleProperty(name).get() }
def modPropertyKeys = [
        'minecraft_version',
        'minecraft_version_range',
        'forge_version',
        'forge_version_range',
        'loader_version_range',
        'mod_id',
        'mod_name',
        'mod_license',
        'mod_version',
        'mod_authors',
        'mod_description'
]

def modId = requiredProperty('mod_id')
def generatedResourcesDir = layout.projectDirectory.dir('src/generated/resources')
def mainResourcesDir = layout.projectDirectory.dir('src/main/resources')
def modMetadata = modPropertyKeys.collectEntries { key -> [(key): requiredProperty(key)] }.asImmutable()

group = requiredProperty('mod_group_id')
version = requiredProperty('mod_version')

base {
    archivesName = modId
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net' }
    maven { url = 'https://libraries.minecraft.net' }
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Sponge'
                url = 'https://repo.spongepowered.org/repository/maven-public'
            }
        }
        filter { includeGroupAndSubgroups('org.spongepowered') }
    }
}

// Mojang ships Java 21 to end users in 1.21+, so mods should target Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

minecraft {
    mappings channel: 'official', version: requiredProperty('minecraft_version')
    reobf = false
    copyIdeResources = true

    // Access Transformers are automatically detected if present.
    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', modId
        }

        server {
            property 'forge.enabledGameTestNamespaces', modId
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', modId
        }

        data {
            workingDirectory project.file('run-data')
            args(
                    '--mod', modId,
                    '--all',
                    '--output', generatedResourcesDir.asFile.absolutePath,
                    '--existing', mainResourcesDir.asFile.absolutePath
            )
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir generatedResourcesDir
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

configurations.configureEach {
    resolutionStrategy.force 'net.sf.jopt-simple:jopt-simple:5.0.4'
}

dependencies {
    minecraft "net.minecraftforge:forge:${requiredProperty('minecraft_version')}-${requiredProperty('forge_version')}"
    implementation fg.deobf("software.bernie.geckolib:geckolib-forge-${requiredProperty('minecraft_version')}:${requiredProperty('geckolib_version')}")
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(modMetadata)
    filteringCharset = 'UTF-8'
    expand(modMetadata)
    from(layout.projectDirectory.dir('src/main/templates'))
    into(layout.buildDirectory.dir('generated/resources/modMetadata'))
}

sourceSets.main.resources.srcDir generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    logging.captureStandardError(LogLevel.DEBUG)
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourceSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
