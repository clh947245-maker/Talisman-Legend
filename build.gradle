plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.126'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Keep the wrapper lightweight; switch to ALL if you want Gradle sources/docs locally.
    distributionType = Wrapper.DistributionType.BIN
}

def requiredProperty = { String name -> providers.gradleProperty(name).get() }
def modPropertyKeys = [
        'minecraft_version',
        'minecraft_version_range',
        'neo_version',
        'loader_version_range',
        'mod_id',
        'mod_name',
        'mod_license',
        'mod_version',
        'mod_authors',
        'mod_description'
]

def modId = requiredProperty('mod_id')
def generatedResourcesDir = layout.projectDirectory.dir('src/generated/resources')
def mainResourcesDir = layout.projectDirectory.dir('src/main/resources')
def generatedModMetadataDir = layout.buildDirectory.dir('generated/resources/modMetadata')
def modMetadata = modPropertyKeys.collectEntries { key -> [(key): requiredProperty(key)] }.asImmutable()
def enableGameTestNamespace = { runConfig ->
    runConfig.systemProperty 'neoforge.enabledGameTestNamespaces', modId
}

group = requiredProperty('mod_group_id')
version = requiredProperty('mod_version')

base {
    archivesName = modId
}

repositories {
    maven { url = 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/' }
}

// Mojang ships Java 21 to end users in 1.21+, so mods should target Java 21.
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

neoForge {
    version = requiredProperty('neo_version')

    parchment {
        mappingsVersion = requiredProperty('parchment_mappings_version')
        minecraftVersion = requiredProperty('parchment_minecraft_version')
    }

    // Access Transformers are automatically detected if present.
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }

        client {
            client()
            enableGameTestNamespace(delegate)
        }

        server {
            server()
            programArgument '--nogui'
            enableGameTestNamespace(delegate)
        }

        gameTestServer {
            type = 'gameTestServer'
            enableGameTestNamespace(delegate)
        }

        data {
            data()

            programArguments.addAll(
                    '--mod', modId,
                    '--all',
                    '--output', generatedResourcesDir.asFile.absolutePath,
                    '--existing', mainResourcesDir.asFile.absolutePath
            )
        }
    }

    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
}

sourceSets {
    main {
        resources {
            srcDir generatedResourcesDir
        }
    }
}

configurations {
    localRuntime
    runtimeClasspath.extendsFrom(localRuntime)
}

dependencies {
    implementation "software.bernie.geckolib:geckolib-neoforge-${requiredProperty('minecraft_version')}:${requiredProperty('geckolib_version')}"
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    inputs.properties(modMetadata)
    filteringCharset = 'UTF-8'
    expand(modMetadata)
    from(layout.projectDirectory.dir('src/main/templates'))
    into(generatedModMetadataDir)
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('repo').asFile.toURI()
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    logging.captureStandardError(LogLevel.DEBUG)
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
